<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Friend Chat</title>
  <link rel="stylesheet" href="/static/chat.css?v=__CHAT_ASSET_VERSION__">
  <script type="importmap">
    {"imports":{"chat-model":"/static/chat_model.mjs?v=__CHAT_ASSET_VERSION__"}}
  </script>
</head>
<body>
  <header id="agent-bar">
    <div id="theme-customizer" aria-label="Chat colors">
      <div class="theme-triggers" role="group" aria-label="Customize chat colors">
        <button class="theme-trigger" type="button" data-theme-key="background"
                aria-label="Choose trim and background color" aria-controls="color-palette"
                aria-expanded="false" title="Trim & background color"></button>
        <button class="theme-trigger" type="button" data-theme-key="assistant"
                aria-label="Choose AI chat color" aria-controls="color-palette"
                aria-expanded="false" title="AI chat color"></button>
        <button class="theme-trigger" type="button" data-theme-key="user"
                aria-label="Choose my chat color" aria-controls="color-palette"
                aria-expanded="false" title="My chat color"></button>
      </div>
      <div id="color-palette" role="listbox" aria-hidden="true"></div>
    </div>
    <strong class="chat-title">AI Friend</strong>
    <span id="agent-mode" class="offline">offline</span>
  </header>
  <div id="status-banner" role="status" aria-live="polite">
    <svg class="takeover-ring" viewBox="0 0 20 20" aria-hidden="true">
      <circle class="ring-track" cx="10" cy="10" r="8"></circle>
      <circle class="ring-progress" cx="10" cy="10" r="8"></circle>
    </svg>
    <span id="takeover-text"></span>
  </div>
  <main id="messages" aria-live="polite"></main>
  <div id="context-menu" role="menu"></div>
  <div id="composer">
    <div id="upload-error" role="alert"></div>
    <div id="attachments"></div>
    <form id="form">
      <input id="file-input" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
      <button id="attach" type="button" title="Attach static images (PNG, JPEG, or WebP)" aria-label="Attach static images (PNG, JPEG, or WebP)">+</button>
      <input id="input" placeholder="Message" autocomplete="off">
      <button id="send" type="submit" title="Send" aria-label="Send">↑</button>
    </form>
  </div>
  <script id="chat-config" type="application/json">
    {"maxImages":__CHAT_MAX_IMAGES__,"maxMediaBytes":__CHAT_MAX_MEDIA_BYTES__,"supportsImages":__LLM_SUPPORTS_IMAGES__,"takeoverSeconds":__CHAT_TAKEOVER_SECONDS__}
  </script>
  <script type="module" src="/static/chat.mjs?v=__CHAT_ASSET_VERSION__"></script>
</body>
</html>
